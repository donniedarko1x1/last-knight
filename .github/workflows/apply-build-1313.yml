name: Apply Build 1.3.13 HUD Alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-build-1313.yml'

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Slim HP and center XP fill
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text()
          old_hp = "  const hpHeightScale=0.82;"
          new_hp = "  const hpHeightScale=0.68;"
          if old_hp not in s:
              raise SystemExit('HP scale marker not found')
          s = s.replace(old_hp, new_hp, 1)
          old_xp = "  const xpInnerX=Math.round(contentLeft+xpW*0.105),xpInnerW=Math.round(xpW*0.79),xpInnerH=Math.max(2,Math.round(xpH*0.13));\n  this.xpFill.setPosition(xpInnerX,xpY).setSize(xpInnerW,xpInnerH).setDisplaySize(xpInnerW,xpInnerH);"
          new_xp = "  const xpInnerX=Math.round(contentLeft+xpW*0.105),xpInnerW=Math.round(xpW*0.79),xpInnerH=Math.max(2,Math.round(xpH*0.13));\n  // Optical centering: the visible opening of the ornate XP frame sits slightly below the sprite midpoint.\n  const xpFillY=Math.round(xpY+Math.max(1,Math.round(3*uiScale)));\n  this.xpFill.setPosition(xpInnerX,xpFillY).setSize(xpInnerW,xpInnerH).setDisplaySize(xpInnerW,xpInnerH);"
          if old_xp not in s:
              raise SystemExit('XP fill marker not found')
          s = s.replace(old_xp, new_xp, 1)
          p.write_text(s)
          PY
          node --check src/main.js
          rm .github/workflows/apply-build-1313.yml
          git config user.name "Last Knight Build Bot"
          git config user.email "actions@github.com"
          git add src/main.js .github/workflows/apply-build-1313.yml
          git commit -m "Build 1.3.13 - Slimmer HP and centered XP fill"
          git push origin main
