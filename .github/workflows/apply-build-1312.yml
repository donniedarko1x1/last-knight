name: Apply Build 1.3.12 HP Bar Height

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-build-1312.yml'

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Thin HP bar vertically
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          old="""  const hpW=Math.round(contentW);\n  const hpH=Math.max(20,Math.round(hpW/hpAspect));\n  const hpY=topRowY;"""
          new="""  const hpW=Math.round(contentW);\n  // Build 1.3.12: keep the approved width, but make the HP frame 18% slimmer vertically.\n  const hpHeightScale=0.82;\n  const hpH=Math.max(16,Math.round((hpW/hpAspect)*hpHeightScale));\n  const hpY=topRowY;"""
          if old not in s:
              raise SystemExit('Expected HP sizing block not found; refusing to modify.')
          if s.count(old) != 1:
              raise SystemExit('HP sizing block is not unique; refusing to modify.')
          p.write_text(s.replace(old,new,1))
          PY
          node --check src/main.js
          git config user.name "Last Knight Build Bot"
          git config user.email "actions@github.com"
          git add src/main.js
          git commit -m "Build 1.3.12 - Slimmer HP Bar"
          git push origin HEAD:main
