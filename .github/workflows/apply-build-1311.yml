name: Apply Build 1.3.11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-build-1311.yml'

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Build 1.3.11
        shell: bash
        run: |
          : > /tmp/build.patch.b64
          printf '%s' '' >> /tmp/build.patch.b64
          printf '%s' '' >> /tmp/build.patch.b64
          printf '%s' '' >> /tmp/build.patch.b64
          printf '%s' '' >> /tmp/build.patch.b64
          printf '%s' '' >> /tmp/build.patch.b64
          printf '%s' '' >> /tmp/build.patch.b64
          printf '%s' '' >> /tmp/build.patch.b64
          base64 -d /tmp/build.patch.b64 > /tmp/build.patch
          git apply --check /tmp/build.patch
          git apply /tmp/build.patch
          mkdir -p public/assets/ui/hero_hud
          printf '%s' '' | base64 -d > public/assets/ui/hero_hud/mana_bottle_blue.png
          test "$(git hash-object src/main.js)" = "85c2f2c600ef5cb7140eda3d234ead04b7d9c8f7"
          test "$(git hash-object public/assets/ui/hero_hud/mana_bottle_blue.png)" = "c0203a8930cfa8239df34c8fb08532ec55abf237"
          node --check src/main.js
          git config user.name "Last Knight Build Bot"
          git config user.email "actions@github.com"
          git add src/main.js public/assets/ui/hero_hud/mana_bottle_blue.png
          git commit -m "Build 1.3.11 - Mana Bottles Visible"
          git push origin HEAD:main
